#cloud-config
package_update: true
package_upgrade: false
packages:
  - git
  - curl
  - vim
  - tmux
  - tree
  - jq
  - net-tools
  - python3
runcmd:
  - mkdir -p /home/ubuntu/labs
  - chown ubuntu:ubuntu /home/ubuntu/labs
  - |
    cat > /home/ubuntu/README-GROKAIDE.txt <<'EOF'
    GrokAide Education client (LFCS / Canonical Ubuntu practice)
    ============================================================
    Platform mounts curriculum at: /mnt/aide-os
    Start with:  less /mnt/aide-os/Study_Projects/00.md
    Objectives:  less /mnt/aide-os/guides/OBJECTIVES_TRACKER.md
    Do destructive labs HERE, not on the platform host.
    EOF
  - chown ubuntu:ubuntu /home/ubuntu/README-GROKAIDE.txt
final_message: "grokaide-edu ready"
