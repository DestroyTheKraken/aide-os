# LFCS Learning Portal — mobile-first static host
server {
    listen 80;
    server_name lfcs-portal;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Guides markdown (tablet download / read)
    location /guides/ {
        alias /srv/lfcs/guides/;
        default_type text/plain;
        charset utf-8;
    }

    location /study/ {
        alias /usr/share/nginx/html/study/;
        default_type text/plain;
        charset utf-8;
    }

    location /static/ {
        alias /usr/share/nginx/static/;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /daily.txt {
        alias /usr/share/nginx/html/daily.txt;
        default_type text/plain;
    }

    location /data/ {
        alias /usr/share/nginx/html/data/;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Open WebUI moved to :3082 (subpath /ai/ broke — clashed with portal /static/)
    location /ai/ {
        return 302 http://$host:3082/;
    }

    # VS Code (code-server) — proxied for Workspace tab iframe
    location /ide/ {
        proxy_pass http://lfcs-ide:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</head>' '<script src="/static/ide-themes.js"></script><script src="/static/ide-theme-sync.js"></script></head>';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}